<script type="text/babel">
const {useState,useMemo,useEffect}=React;
const YEAR=new Date().getFullYear();
const P={
search:<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>,
plus:<path d="M5 12h14M12 5v14"/>,
sun:<><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-2.93 1.41-1.41m11.32-11.32 1.41-1.41M2 12h2m16 0h2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41"/></>,
moon:<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>,
grid:<><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></>,
list:<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>,
x:<path d="M18 6 6 18M6 6l12 12"/>,
trash:<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>,
pencil:<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>,
book:<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>,
open:<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>,
file:<><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></>,
tag:<><path d="M12 2H2v10l9.29 9.29a1 1 0 0 0 1.42 0l8.58-8.58a1 1 0 0 0 0-1.42z"/><path d="M7 7h.01"/></>,
star:<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.2-6.2 3.2L7 14.2 2 9.3l6.9-1z"/>,
image:<><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></>
};
const Icon=({n,c="w-4 h-4",fill})=><svg viewBox="0 0 24 24" className={c} fill={fill?"currentColor":"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{P[n]}</svg>;

const STATUS={
 "Okunacak":"bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300",
 "Okunuyor":"bg-indigo-100 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300",
 "Tamamlandı":"bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300",
 "Yarıda Bırakıldı":"bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300"};
const GRAD=["from-indigo-600 to-violet-700","from-sky-600 to-indigo-700","from-rose-500 to-fuchsia-700","from-emerald-600 to-teal-700","from-amber-500 to-orange-700","from-slate-600 to-slate-800"];
const GENRES=["Roman","Bilim Kurgu","Tarih","Yazılım","Felsefe","Kişisel Gelişim","Şiir","Diğer"];
const SEED=[
{id:1,title:"Kürk Mantolu Madonna",author:"Sabahattin Ali",pages:160,genre:"Roman",publisher:"Yapı Kredi",status:"Tamamlandı",start:`${YEAR}-01-05`,end:`${YEAR}-01-12`,rating:5,notes:"Raif Efendi'nin sessizliği çok etkileyici.",cover:""},
{id:2,title:"Dune",author:"Frank Herbert",pages:688,genre:"Bilim Kurgu",publisher:"Ithaki",status:"Okunuyor",start:`${YEAR}-09-01`,end:"",rating:0,notes:"",cover:""},
{id:3,title:"Clean Code",author:"Robert C. Martin",pages:464,genre:"Yazılım",publisher:"Pearson",status:"Okunacak",start:"",end:"",rating:0,notes:"",cover:""},
{id:4,title:"Nutuk",author:"Mustafa Kemal Atatürk",pages:640,genre:"Tarih",publisher:"Türk Tarih Kurumu",status:"Tamamlandı",start:`${YEAR}-03-01`,end:`${YEAR}-04-10`,rating:4,notes:"",cover:""}];
const EMPTY={title:"",author:"",pages:"",genre:"Roman",publisher:"",status:"Okunacak",start:"",end:"",rating:0,notes:"",cover:"",tags:[]};
const SEED_TAGS={1:["klasik","favori"],2:["seri","uzay"],3:["mesleki"],4:["tarih","klasik"]};
const norm=l=>l.map(b=>({...b,tags:b.tags||SEED_TAGS[b.id]||[]}));
const hash=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0);

const Stars=({v,on,size="w-4 h-4"})=><div className="flex gap-0.5">{[1,2,3,4,5].map(i=>
 <button key={i} type="button" disabled={!on} onClick={()=>on&&on(v===i?0:i)} className={(i<=v?"text-amber-400":"text-slate-300 dark:text-slate-600")+(on?" hover:scale-110 transition":" cursor-default")}><Icon n="star" c={size} fill={i<=v}/></button>)}</div>;

const Cover=({b,cls})=>b.cover
 ?<img src={b.cover} alt={b.title} className={cls+" object-cover"}/>
 :<div className={`${cls} bg-gradient-to-br ${GRAD[hash(b.title)%GRAD.length]} flex flex-col justify-between p-3 text-white`}>
   <Icon n="open" c="w-5 h-5 opacity-70"/><div className="text-xs font-semibold leading-tight line-clamp-4">{b.title}</div></div>;

const Badge=({s})=><span className={`text-[11px] font-medium px-2 py-0.5 rounded-full whitespace-nowrap ${STATUS[s]}`}>{s}</span>;

const StatCard=({icon,label,value,tone})=><div className="pop rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white/70 dark:bg-white/5 backdrop-blur p-4 shadow-sm flex items-center gap-4">
 <div className={`w-11 h-11 rounded-xl grid place-items-center ${tone}`}><Icon n={icon} c="w-5 h-5"/></div>
 <div className="min-w-0"><div className="text-xs text-slate-500 dark:text-slate-400">{label}</div><div className="text-xl font-bold truncate">{value}</div></div></div>;

const Header=({q,setQ,dark,setDark,onAdd})=><header className="sticky top-0 z-30 backdrop-blur-xl bg-white/70 dark:bg-slate-950/70 border-b border-slate-200/70 dark:border-white/10">
 <div className="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3">
  <div className="flex items-center gap-2 font-bold text-lg"><div className="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 text-white grid place-items-center shadow-lg shadow-indigo-500/30"><Icon n="book" c="w-5 h-5"/></div><span className="hidden sm:block">Kitaplığım</span></div>
  <div className="relative flex-1 max-w-md mx-auto"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon n="search"/></span>
   <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Kitap, yazar veya tür ara…" className="w-full h-10 pl-9 pr-3 rounded-xl bg-slate-100 dark:bg-white/10 outline-none focus:ring-2 ring-indigo-500/50 text-sm"/></div>
  <button onClick={()=>setDark(!dark)} className="w-10 h-10 rounded-xl grid place-items-center hover:bg-slate-100 dark:hover:bg-white/10 transition" aria-label="Tema"><Icon n={dark?"sun":"moon"} c="w-5 h-5"/></button>
  <button onClick={onAdd} className="h-10 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium flex items-center gap-1.5 shadow-lg shadow-indigo-500/25 transition"><Icon n="plus"/><span className="hidden sm:block">Yeni Kitap Ekle</span></button>
 </div></header>;

const sel="h-10 px-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-white/10 text-sm outline-none focus:ring-2 ring-indigo-500/50";

const Filters=({status,setStatus,sort,setSort,view,setView})=><div className="flex flex-wrap items-center gap-3">
 <div className="flex gap-1.5 overflow-x-auto max-w-full">{["Hepsi",...Object.keys(STATUS)].map(s=>
  <button key={s} onClick={()=>setStatus(s)} className={`h-9 px-3 rounded-full text-sm whitespace-nowrap transition ${status===s?"bg-indigo-600 text-white shadow":"bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 hover:border-indigo-400"}`}>{s}</button>)}</div>
 <div className="ml-auto flex items-center gap-2">
  <select value={sort} onChange={e=>setSort(e.target.value)} className={sel}>
   <option value="added">Eklenme tarihi</option><option value="az">A → Z</option><option value="rating">Puana göre</option><option value="pages">Sayfa sayısı</option></select>
  <div className="flex p-1 rounded-xl bg-slate-200/70 dark:bg-white/10">{[["grid","grid"],["table","list"]].map(([v,i])=>
   <button key={v} onClick={()=>setView(v)} className={`w-9 h-8 rounded-lg grid place-items-center transition ${view===v?"bg-white dark:bg-slate-700 shadow text-indigo-600 dark:text-indigo-300":"text-slate-500"}`}><Icon n={i}/></button>)}</div>
 </div></div>;

const BookCard=({b,i,onEdit,onDel})=><div style={{animationDelay:i*40+"ms"}} className="pop group rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white dark:bg-white/5 shadow-sm hover:shadow-xl hover:-translate-y-1 transition overflow-hidden flex flex-col">
 <div className="relative"><Cover b={b} cls="w-full h-52"/>
  <div className="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition">
   <button onClick={()=>onEdit(b)} className="w-8 h-8 rounded-lg bg-white/90 text-slate-700 grid place-items-center"><Icon n="pencil"/></button>
   <button onClick={()=>onDel(b.id)} className="w-8 h-8 rounded-lg bg-white/90 text-rose-600 grid place-items-center"><Icon n="trash"/></button></div></div>
 <div className="p-4 flex-1 flex flex-col gap-2">
  <Badge s={b.status}/>
  <div><h3 className="font-semibold leading-snug line-clamp-2">{b.title}</h3><p className="text-sm text-slate-500 dark:text-slate-400">{b.author}</p></div>
  <div className="text-xs text-slate-500 dark:text-slate-400 flex gap-3"><span className="flex items-center gap-1"><Icon n="file" c="w-3.5 h-3.5"/>{b.pages} s.</span><span className="flex items-center gap-1"><Icon n="tag" c="w-3.5 h-3.5"/>{b.genre}</span></div>
  {b.tags.length>0&&<div className="flex flex-wrap gap-1">{b.tags.map(t=><span key={t} className={chip}>#{t}</span>)}</div>}
  <div className="mt-auto pt-1"><Stars v={b.rating}/></div>
  {b.notes&&<p className="text-xs italic text-slate-500 dark:text-slate-400 line-clamp-2 border-l-2 border-indigo-400 pl-2">{b.notes}</p>}
 </div></div>;

const BookTable=({list,onEdit,onDel})=><div className="pop rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white dark:bg-white/5 shadow-sm overflow-x-auto">
 <table className="w-full text-sm min-w-[920px]"><thead><tr className="text-left text-xs text-slate-500 border-b border-slate-200 dark:border-white/10">
  {["Kitap","Tür","Etiketler","Sayfa","Yayın Evi","Durum","Tarihler","Puan",""].map(h=><th key={h} className="px-4 py-3 font-medium">{h}</th>)}</tr></thead>
 <tbody>{list.map(b=><tr key={b.id} className="border-b last:border-0 border-slate-100 dark:border-white/5 hover:bg-slate-50 dark:hover:bg-white/5">
  <td className="px-4 py-3"><div className="flex items-center gap-3"><Cover b={b} cls="w-9 h-12 rounded-md shrink-0 [&_div]:hidden"/><div><div className="font-medium">{b.title}</div><div className="text-xs text-slate-500">{b.author}</div></div></div></td>
  <td className="px-4">{b.genre}</td>
  <td className="px-4"><div className="flex flex-wrap gap-1 max-w-[180px]">{b.tags.length?b.tags.map(t=><span key={t} className={chip}>#{t}</span>):"—"}</div></td>
  <td className="px-4">{b.pages}</td><td className="px-4 text-slate-500">{b.publisher||"—"}</td>
  <td className="px-4"><Badge s={b.status}/></td>
  <td className="px-4 text-xs text-slate-500">{b.start||"—"} → {b.end||"—"}</td>
  <td className="px-4"><Stars v={b.rating} size="w-3.5 h-3.5"/></td>
  <td className="px-4"><div className="flex gap-1"><button onClick={()=>onEdit(b)} className="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-white/10"><Icon n="pencil"/></button><button onClick={()=>onDel(b.id)} className="p-2 rounded-lg text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-500/10"><Icon n="trash"/></button></div></td>
 </tr>)}</tbody></table></div>;

const chip="text-[11px] px-1.5 py-0.5 rounded-md bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300";

const TagBar=({tags,sel,setSel})=>tags.length>0&&<div className="flex flex-wrap items-center gap-2">
 <span className="text-xs text-slate-500 flex items-center gap-1"><Icon n="tag" c="w-3.5 h-3.5"/>Etiketler</span>
 {tags.map(([t,n])=>{const on=sel.includes(t);return <button key={t} onClick={()=>setSel(on?sel.filter(x=>x!==t):[...sel,t])} className={`h-7 px-2.5 rounded-full text-xs transition ${on?"bg-violet-600 text-white shadow":"bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300 hover:bg-violet-200 dark:hover:bg-violet-500/25"}`}>#{t} <span className="opacity-60">{n}</span></button>})}
 {sel.length>0&&<button onClick={()=>setSel([])} className="text-xs text-slate-500 underline">Temizle</button>}</div>;

const TagInput=({tags,onChange,suggest})=>{
 const [v,setV]=useState("");
 const add=t=>{t=t.trim().toLowerCase().replace(/^#/,"");if(t&&!tags.includes(t))onChange([...tags,t]);setV("")};
 const rest=suggest.filter(s=>!tags.includes(s)).slice(0,8);
 return <div>
  <div className="flex flex-wrap items-center gap-1.5 p-2 rounded-xl bg-slate-100 dark:bg-white/10 focus-within:ring-2 ring-indigo-500/50">
   {tags.map(t=><span key={t} className="inline-flex items-center gap-1 text-xs px-2 py-1 rounded-lg bg-violet-100 text-violet-700 dark:bg-violet-500/20 dark:text-violet-300">#{t}<button type="button" onClick={()=>onChange(tags.filter(x=>x!==t))}><Icon n="x" c="w-3 h-3"/></button></span>)}
   <input value={v} placeholder="Etiket yaz, Enter'a bas" className="flex-1 min-w-[130px] bg-transparent outline-none text-sm h-6"
    onChange={e=>e.target.value.endsWith(",")?add(e.target.value.slice(0,-1)):setV(e.target.value)}
    onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();add(v)}else if(e.key==="Backspace"&&!v&&tags.length)onChange(tags.slice(0,-1))}}
    onBlur={()=>add(v)}/></div>
  {rest.length>0&&<div className="flex flex-wrap gap-1 mt-2">{rest.map(s=><button type="button" key={s} onClick={()=>add(s)} className="text-xs px-2 py-0.5 rounded-full border border-dashed border-slate-300 dark:border-white/20 hover:border-violet-500">+ {s}</button>)}</div>}
 </div>};

const Field=({label,children,cls=""})=><label className={"block "+cls}><span className="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1 block">{label}</span>{children}</label>;
const inp="w-full h-10 px-3 rounded-xl bg-slate-100 dark:bg-white/10 outline-none focus:ring-2 ring-indigo-500/50 text-sm";

const BookModal=({book,onClose,onSave,allTags})=>{
 const [f,setF]=useState(book);
 const set=(k,v)=>setF(p=>({...p,[k]:v}));
 const upload=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,320/im.width),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);set("cover",c.toDataURL("image/jpeg",.8))};im.src=r.result};r.readAsDataURL(file)};
 const ok=f.title.trim()&&f.author.trim();
 return <div className="fixed inset-0 z-50 grid place-items-center p-4 bg-slate-950/50 backdrop-blur-sm" onClick={onClose}>
  <div onClick={e=>e.stopPropagation()} className="pop w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-white/10 shadow-2xl">
   <div className="flex items-center justify-between p-5 border-b border-slate-200 dark:border-white/10"><h2 className="font-bold text-lg">{book.id?"Kitabı Düzenle":"Yeni Kitap Ekle"}</h2>
    <button onClick={onClose} className="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-white/10"><Icon n="x"/></button></div>
   <div className="p-5 grid sm:grid-cols-[150px_1fr] gap-5">
    <div><Cover b={f} cls="w-full h-52 rounded-xl"/>
     <label className="mt-2 h-9 rounded-xl border border-dashed border-slate-300 dark:border-white/20 text-xs flex items-center justify-center gap-1.5 cursor-pointer hover:border-indigo-500"><Icon n="image"/>Kapak yükle<input type="file" accept="image/*" onChange={upload} className="hidden"/></label></div>
    <div className="grid grid-cols-2 gap-3">
     <Field label="Kitap Adı *" cls="col-span-2"><input className={inp} value={f.title} onChange={e=>set("title",e.target.value)}/></Field>
     <Field label="Yazar *"><input className={inp} value={f.author} onChange={e=>set("author",e.target.value)}/></Field>
     <Field label="Sayfa Sayısı"><input type="number" min="0" className={inp} value={f.pages} onChange={e=>set("pages",e.target.value)}/></Field>
     <Field label="Tür"><select className={inp} value={f.genre} onChange={e=>set("genre",e.target.value)}>{GENRES.map(g=><option key={g}>{g}</option>)}</select></Field>
     <Field label="Yayın Evi"><input className={inp} value={f.publisher} onChange={e=>set("publisher",e.target.value)}/></Field>
     <Field label="Okuma Durumu" cls="col-span-2"><select className={inp} value={f.status} onChange={e=>set("status",e.target.value)}>{Object.keys(STATUS).map(s=><option key={s}>{s}</option>)}</select></Field>
     <Field label="Başlama Tarihi"><input type="date" className={inp} value={f.start} onChange={e=>set("start",e.target.value)}/></Field>
     <Field label="Bitirme Tarihi"><input type="date" className={inp} value={f.end} onChange={e=>set("end",e.target.value)}/></Field>
     <Field label="Puan" cls="col-span-2"><Stars v={f.rating} on={v=>set("rating",v)} size="w-6 h-6"/></Field>
    </div>
    <div className="sm:col-span-2"><span className="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1 block">Etiketler</span><TagInput tags={f.tags||[]} onChange={v=>set("tags",v)} suggest={allTags}/></div>
    <Field label="Kişisel Notlar / Alıntılar" cls="sm:col-span-2"><textarea rows="3" className="w-full p-3 rounded-xl bg-slate-100 dark:bg-white/10 outline-none focus:ring-2 ring-indigo-500/50 text-sm resize-none" value={f.notes} onChange={e=>set("notes",e.target.value)}/></Field>
   </div>
   <div className="p-5 pt-0 flex justify-end gap-2">
    <button onClick={onClose} className="h-10 px-4 rounded-xl hover:bg-slate-100 dark:hover:bg-white/10 text-sm">Vazgeç</button>
    <button disabled={!ok} onClick={()=>onSave({...f,pages:+f.pages||0})} className="h-10 px-5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white text-sm font-medium">Kaydet</button></div>
  </div></div>;
};

function App(){
 const [books,setBooks]=useState(()=>{try{const s=localStorage.getItem("lib-books");return norm(s?JSON.parse(s):SEED)}catch(e){return norm(SEED)}});
 const [dark,setDark]=useState(()=>{try{const t=localStorage.getItem("lib-theme");if(t)return t==="dark"}catch(e){}return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches});
 const [q,setQ]=useState(""),[status,setStatus]=useState("Hepsi"),[sort,setSort]=useState("added"),[view,setView]=useState("grid"),[modal,setModal]=useState(null),[tagSel,setTagSel]=useState([]);
 useEffect(()=>{document.documentElement.classList.toggle("dark",dark);try{localStorage.setItem("lib-theme",dark?"dark":"light")}catch(e){}},[dark]);
 useEffect(()=>{try{localStorage.setItem("lib-books",JSON.stringify(books))}catch(e){}},[books]);

 const stats=useMemo(()=>{
  const read=books.filter(b=>b.status==="Tamamlandı"&&(b.end||"").startsWith(YEAR)).reduce((a,b)=>a+b.pages,0);
  return {total:books.length,read,now:books.filter(b=>b.status==="Okunuyor").length};},[books]);

 const allTags=useMemo(()=>{const c={};books.forEach(b=>b.tags.forEach(t=>c[t]=(c[t]||0)+1));return Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"tr"))},[books]);
 useEffect(()=>setTagSel(s=>s.filter(t=>allTags.some(x=>x[0]===t))),[allTags]);
 const list=useMemo(()=>{
  const t=q.toLowerCase();
  const r=books.filter(b=>(status==="Hepsi"||b.status===status)&&tagSel.every(x=>b.tags.includes(x))&&[b.title,b.author,b.genre,b.publisher,...b.tags].join(" ").toLowerCase().includes(t));
  const s={added:(a,b)=>b.id-a.id,az:(a,b)=>a.title.localeCompare(b.title,"tr"),rating:(a,b)=>b.rating-a.rating,pages:(a,b)=>b.pages-a.pages}[sort];
  return [...r].sort(s);},[books,q,status,sort,tagSel]);

 const save=b=>{setBooks(p=>b.id?p.map(x=>x.id===b.id?b:x):[{...b,id:Date.now()},...p]);setModal(null)};
 const del=id=>setBooks(p=>p.filter(b=>b.id!==id));

 return <div className="relative">
  <div className="pointer-events-none fixed inset-0 overflow-hidden -z-0"><div className="absolute -top-32 -left-24 w-96 h-96 rounded-full bg-indigo-400/20 dark:bg-indigo-600/20 blur-3xl"/><div className="absolute top-1/3 -right-24 w-96 h-96 rounded-full bg-violet-400/20 dark:bg-violet-600/20 blur-3xl"/></div>
  <Header q={q} setQ={setQ} dark={dark} setDark={setDark} onAdd={()=>setModal(EMPTY)}/>
  <main className="relative max-w-7xl mx-auto px-4 py-6 space-y-6">
   <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
    <StatCard icon="book" label="Toplam Kitap" value={stats.total} tone="bg-indigo-100 text-indigo-600 dark:bg-indigo-500/20 dark:text-indigo-300"/>
    <StatCard icon="file" label={`${YEAR} Okunan Sayfa`} value={stats.read.toLocaleString("tr-TR")} tone="bg-emerald-100 text-emerald-600 dark:bg-emerald-500/20 dark:text-emerald-300"/>
    <StatCard icon="open" label="Şu An Okunan" value={stats.now} tone="bg-sky-100 text-sky-600 dark:bg-sky-500/20 dark:text-sky-300"/>
   </div>
   <Filters status={status} setStatus={setStatus} sort={sort} setSort={setSort} view={view} setView={setView}/>
   <TagBar tags={allTags} sel={tagSel} setSel={setTagSel}/>
   {list.length===0
    ?<div className="text-center py-20 text-slate-500"><Icon n="book" c="w-10 h-10 mx-auto mb-3 opacity-40"/>Kitap bulunamadı.</div>
    :view==="grid"
     ?<div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">{list.map((b,i)=><BookCard key={b.id} b={b} i={i} onEdit={setModal} onDel={del}/>)}</div>
     :<BookTable list={list} onEdit={setModal} onDel={del}/>}
  </main>
  {modal&&<BookModal book={modal} onClose={()=>setModal(null)} onSave={save} allTags={allTags.map(x=>x[0])}/>}
 </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<!-- Service Worker Kayıt Kodu -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker başarıyla kaydoldu:', reg.scope))
        .catch(err => console.error('Service Worker hatası:', err));
    });
  }
</script>
</body>
</html>
